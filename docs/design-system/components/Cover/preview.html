<!-- @dsCard height=288 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg-page); }
  .cv svg { position: absolute; inset: 0; }
  .slab { fill: var(--brown-700); }
  .deep { fill: var(--brown-900); }
  .tint { fill: var(--brown-200); }
  .honey { fill: var(--honey-500); }
  .leaf { fill: none; stroke: var(--cream); stroke-width: 2; stroke-linecap: round; }
  .stem { fill: none; stroke: var(--cream); stroke-width: 2; stroke-linecap: round; }
  .rule { stroke: var(--brown-300); stroke-width: 1; }
  .txt { position: absolute; left: 48px; bottom: 44px; max-width: 420px; }
  .name { margin: 0; font: 700 100px/0.95 var(--font-serif); color: var(--text); letter-spacing: -0.02em; }
  .tag { margin: 16px 0 0; font: 500 14px/20px var(--font-sans); color: var(--text-muted); }
</style></head>
<body>
<div class="cv">
  <!--
    blocks: brown-700 tall slab 200×288 (x560), brown-900 200×136 (x760, top), brown-200 200×152 (x760, bottom), honey-500 disc d=48 (points accent, small)
    arrangement: one tall slab with satellites, bleeding top and bottom — like the H stem with the S leaning on it
    pattern: literal motif (the logo's leaf branch) → three leaf lenses + one stem, hairline in cream, crossing the slab; chosen because the leaf is the one shape the brand owns
    scales: block widths = sidebar-ish 200 (space-8 multiples), gap 0, hairline 1px brown-300 baseline
  -->
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <line class="rule" x1="480" y1="252" x2="560" y2="252"/>
    <rect class="slab" x="560" y="0" width="200" height="288"/>
    <rect class="deep" x="760" y="0" width="200" height="136"/>
    <rect class="tint" x="760" y="136" width="200" height="152"/>
    <circle class="honey" cx="860" cy="212" r="24"/>
    <path class="stem" d="M600 270 C650 220 690 160 700 60"/>
    <path class="leaf" d="M700 60 C688 40 690 22 702 6 C716 24 714 44 700 60 Z"/>
    <path class="leaf" d="M690 130 C708 108 730 102 752 106 C738 128 714 136 690 130 Z"/>
    <path class="leaf" d="M662 196 C684 182 706 182 726 192 C706 208 684 208 662 196 Z"/>
  </svg>
  <div class="txt">
    <h1 class="name">희수영어</h1>
    <p class="tag">한 문장씩, 깊이 있게 — 전주의 중·고등 영어</p>
  </div>
</div>
</body>
</html>
