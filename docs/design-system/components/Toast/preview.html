<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Toast</title>
<style>body{padding:20px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .col{display:flex;flex-direction:column;gap:16px} .cap{font:500 12px/16px var(--font-sans);color:var(--text-muted);margin:0 0 8px}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Heesu, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'col',style:{alignItems:'flex-start'}},
 h(H.Toast,{tone:'success',actionLabel:'되돌리기'},'중2 A반 11/3 출결을 저장했어요'),
 h(H.Toast,{tone:'danger'},'저장하지 못했어요. 인터넷 연결을 확인해 주세요.'),
 h(H.Toast,{tone:'points'},'숙제 완료! +30P 받았어요')
));
</script>
</body>
</html>
