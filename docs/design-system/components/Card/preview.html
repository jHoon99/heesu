<!-- @dsCard group="Layout" height=230 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Card</title>
<style>body{padding:20px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .col{display:flex;flex-direction:column;gap:16px} .cap{font:500 12px/16px var(--font-sans);color:var(--text-muted);margin:0 0 8px}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Heesu, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:16}},
 h(H.Card,{title:'중등부',subtitle:'중1–중3 · 주 3회',actions:h(H.Badge,{tone:'brand'},'정원 8명')}, h('p',{style:{margin:0,font:'400 15px/24px var(--font-sans)',color:'var(--gray-700)'}},'교과서 본문 정독과 문법을 함께. 매 수업 단어 시험.')),
 h(H.Card,{tone:'subtle',title:'오늘 수업',subtitle:'11/3 (화) 17:00'}, h('div',{className:'row'},h(H.StatusChip,{status:'present'}),h(H.StatusChip,{status:'done',label:'숙제 완료'}))),
 h(H.Card,{tone:'raised',title:'관리자 카드 (raised)'}, h('p',{style:{margin:0,font:'400 14px/22px var(--font-sans)',color:'var(--text-muted)'}},'흰 표면. 관리자 화면에서 사용.'))
));
</script>
</body>
</html>
