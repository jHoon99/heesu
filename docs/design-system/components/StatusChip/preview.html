<!-- @dsCard group="Status" height=170 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StatusChip</title>
<style>body{padding:20px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .col{display:flex;flex-direction:column;gap:16px} .cap{font:500 12px/16px var(--font-sans);color:var(--text-muted);margin:0 0 8px}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Heesu, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'col'},
 h('div',null,h('p',{className:'cap'},'출결'),h('div',{className:'row'}, ['present','late','absent','makeup'].map(function(s){return h(H.StatusChip,{key:s,status:s});}))),
 h('div',null,h('p',{className:'cap'},'숙제 · 미입력'),h('div',{className:'row'}, h(H.StatusChip,{status:'done',label:'숙제 완료'}), h(H.StatusChip,{status:'missing',label:'숙제 미완료'}), h(H.StatusChip,{status:'none'}))),
 h('div',null,h('p',{className:'cap'},'표 안 (sm)'),h('div',{className:'row'}, ['present','late','absent','makeup','done','missing','none'].map(function(s){return h(H.StatusChip,{key:s,status:s,size:'sm'});})))
));
</script>
</body>
</html>
