<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Icon</title>
<style>body{padding:20px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .col{display:flex;flex-direction:column;gap:16px} .cap{font:500 12px/16px var(--font-sans);color:var(--text-muted);margin:0 0 8px}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Heesu, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row',style:{gap:18,color:'var(--gray-700)'}},
 ['check','x','clock','repeat','alert','home','book','video','play','trophy','user','users','calendar','clipboard','chat','bell','chart','settings','phone','sparkle','search','download','pin','chevronLeft','chevronRight','chevronDown'].map(function(n){return h('span',{key:n,title:n,style:{display:'inline-flex'}},h(H.Icon,{name:n,size:22}));})
));
</script>
</body>
</html>
