<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button</title>
<style>body{padding:20px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .col{display:flex;flex-direction:column;gap:16px} .cap{font:500 12px/16px var(--font-sans);color:var(--text-muted);margin:0 0 8px}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Heesu, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'col'},
 h('div',{className:'row'}, h(H.Button,{variant:'primary'},'상담 신청하기'), h(H.Button,{variant:'secondary'},'수업 안내 보기'), h(H.Button,{variant:'ghost',icon:'download'},'엑셀로 받기'), h(H.Button,{variant:'danger'},'학생 삭제'), h(H.Button,{variant:'primary',disabled:true},'저장')),
 h('div',{className:'row'}, h(H.Button,{variant:'primary',size:'sm'},'저장'), h(H.Button,{size:'sm',icon:'chevronLeft'},'지난주'), h(H.Button,{variant:'primary',size:'lg',icon:'phone'},'전화 상담'))
));
</script>
</body>
</html>
