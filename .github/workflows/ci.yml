name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - run: npm run fn:check

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      # edge-runtime 제외: Edge Function은 위 fn:check의 Deno 단위 테스트로 검사해서 런타임이 필요 없다.
      - run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - run: npm run db:test

      - name: Check generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code src/core/supabase/database.types.ts

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:56321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
