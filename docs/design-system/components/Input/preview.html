<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Input</title>
<style>body{padding:20px;} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .col{display:flex;flex-direction:column;gap:16px} .cap{font:500 12px/16px var(--font-sans);color:var(--text-muted);margin:0 0 8px}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Heesu, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:20,maxWidth:760}},
 h(H.Input,{label:'학부모 성함',required:true,placeholder:'홍길동'}),
 h(H.Input,{label:'연락처',required:true,type:'tel',defaultValue:'010-12',error:'010-0000-0000 형식으로 입력해 주세요.'}),
 h(H.Input,{label:'학교',placeholder:'예: ○○중',hint:'정확하지 않아도 괜찮아요.'}),
 h(H.Input,{label:'메모 (관리자 화면 · md)',size:'md',placeholder:'학생 특이사항'}),
 h('div',{style:{gridColumn:'1 / -1'}}, h(H.Input,{label:'궁금한 점',multiline:true,placeholder:'현재 영어 성적, 고민되는 부분을 편하게 적어 주세요.'}))
));
</script>
</body>
</html>
