<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AttendanceTable</title>
<style>body{padding:20px;background:var(--bg-admin);} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .col{display:flex;flex-direction:column;gap:16px} .cap{font:500 12px/16px var(--font-sans);color:var(--text-muted);margin:0 0 8px}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Heesu, h = React.createElement;

var students=[{id:'s1',name:'김하늘',meta:'중2'},{id:'s2',name:'이도윤',meta:'중2'},{id:'s3',name:'박서연',meta:'중2'},{id:'s4',name:'최준우',meta:'중2'},{id:'s5',name:'정민서',meta:'중2'},{id:'s6',name:'한지호',meta:'중2'},{id:'s7',name:'오예린',meta:'중2'},{id:'s8',name:'윤시우',meta:'중2'}];
var dates=[{key:'d1',label:'10/27',day:'월'},{key:'d2',label:'10/29',day:'수'},{key:'d3',label:'10/31',day:'금'},{key:'d4',label:'11/3',day:'월'},{key:'d5',label:'11/5',day:'수',today:true}];
var P=['present','present','present','late','present','absent','makeup','present'];
var W=['done','done','missing','done','done','none','done','missing'];
var rec={}; students.forEach(function(s,i){ rec[s.id]={}; dates.forEach(function(d,j){ if(d.today) { if(i<3) rec[s.id][d.key]={att:'present',hw:i==1?'missing':'done'}; return;} rec[s.id][d.key]={att:P[(i*3+j*5)%8],hw:W[(i*5+j*3)%8]}; }); });
rec.s6.d4={att:'absent',hw:'none'}; rec.s6.d3={att:'absent',hw:'none'};
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'col'},
 h(H.AttendanceTable,{students:students,dates:dates,defaultRecords:rec}), h(H.AttendanceTable.Legend)
));
</script>
</body>
</html>
